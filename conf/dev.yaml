catalog: retail_dev
schema: sales

source:
  raw_path: "dbfs:/mnt/landing/retail_sales/"
  raw_format: json
  schema_location: "dbfs:/mnt/landing/retail_sales/_schema"

bronze:
  table: bronze_sales_raw
  checkpoint_path: "dbfs:/pipelines/retail_sales/checkpoints/bronze"

silver:
