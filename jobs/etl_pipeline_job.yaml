resources:
  jobs:
    etl_pipeline:
      name: retail-sales-etl-${bundle.target}

      schedule:
        quartz_cron_expression: "0 0 3 * * ?"   # 03:00 every day
        timezone_id: "Asia/Kolkata"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - data-eng-alerts@example.com

      webhook_notifications:
        on_failure:
          - id: ${var.slack_webhook_id}

      parameters:
        - name: env
          default: ${bundle.target}
        - name: run_date
          default: "{{job.trigger.time.iso_date}}"

      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            autoscale:
              min_workers: 1
              max_workers: 4
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
            custom_tags:
              project: retail-sales-etl
              cost_center: data-engineering

      tasks:
        - task_key: bronze_ingest
          job_cluster_key: etl_cluster
          python_wheel_task:
            package_name: retail_etl
            entry_point: bronze_ingest
            parameters: ["--env", "{{job.parameters.env}}", "--run-date", "{{job.parameters.run_date}}"]
          libraries:
            - whl: ../dist/*.whl
          timeout_seconds: 3600
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: etl_cluster
          python_wheel_task:
            package_name: retail_etl
            entry_point: silver_transform
            parameters: ["--env", "{{job.parameters.env}}", "--run-date", "{{job.parameters.run_date}}"]
          libraries:
            - whl: ../dist/*.whl
          timeout_seconds: 3600
          max_retries: 2

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_transform
          job_cluster_key: etl_cluster
          python_wheel_task:
            package_name: retail_etl
            entry_point: gold_aggregate
            parameters: ["--env", "{{job.parameters.env}}", "--run-date", "{{job.parameters.run_date}}"]
          libraries:
            - whl: ../dist/*.whl
          timeout_seconds: 1800
          max_retries: 2

        - task_key: data_quality_gate
          depends_on:
            - task_key: gold_aggregate
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ../notebooks/dq_summary_report.py
            base_parameters:
              env: "{{job.parameters.env}}"
              run_date: "{{job.parameters.run_date}}"

variables:
  slack_webhook_id:
    description: Databricks notification destination ID for Slack alerts
    default: "0000000-0000-0000-0000-000000000000"
